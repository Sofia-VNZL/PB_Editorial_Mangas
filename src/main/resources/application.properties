spring.application.name=TP1-Editorial-mangas-sofia-castro

# H2 Database
#spring.datasource.url=jdbc:h2:mem:TP1-Editorial-mangas-sofia-castro
spring.datasource.url=jdbc:h2:file:./data/mangadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Portas

server.port=8080
avaliacao.service.url=http://localhost:8081

#Rabbit
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

avaliacao.rabbitmq.exchange=avaliacao.exchange
avaliacao.rabbitmq.routing-key=avaliacao.criada
avaliacao.rabbitmq.queue=avaliacao.criada.queue

#monitorameto
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Editorial de Mangás
info.app.version=1.0.0
info.app.description=API REST para gestão de mangas e autores