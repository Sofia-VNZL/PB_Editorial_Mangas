apiVersion: apps/v1
kind: Deployment
metadata:
  name: avaliacao-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avaliacao-service
  template:
    metadata:
      labels:
        app: avaliacao-service
    spec:
      containers:
        - name: avaliacao-service
          image: avaliacao-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: guest
            - name: SPRING_RABBITMQ_PASSWORD
              value: guest
---
apiVersion: v1
kind: Service
metadata:
  name: avaliacao-service
spec:
  selector:
    app: avaliacao-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP